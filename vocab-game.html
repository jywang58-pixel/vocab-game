      radial-gradient(1200px 600px at 50% -10%, var(--bg-2), var(--bg-1));
    background-repeat: repeat, no-repeat;
    background-position: 0 0, center top;
    background-size: 260px 260px, cover;
    background-attachment: scroll, scroll;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:24px 16px 60px;
    line-height:1.5;
  }
  .app{ width:100%; max-width:640px; }

  header.top{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px; flex-wrap:wrap; gap:10px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{
    width:40px;height:40px;border-radius:12px;
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));
    display:flex;align-items:center;justify-content:center;
    color:#fff; font-weight:700; font-size:18px; box-shadow: var(--shadow);
  }
  .brand h1{ font-size:23px; margin:0; letter-spacing:0.2px; }
  .brand p{ margin:0; font-size:14px; color:var(--ink-soft); }

  .stats-bar{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:12px 16px; margin-bottom:16px; box-shadow: var(--shadow);
  }
  .stats-row{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .stat{ display:flex; flex-direction:column; min-width:56px; }
  .stat .num{ font-size:22px; font-weight:700; }
  .stat .lbl{ font-size:13px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em; }
  .streak{ color:var(--accent); }
  .xp-wrap{ flex:1; min-width:140px; }
  .xp-bar-bg{ height:8px; background:var(--bg-2); border-radius:99px; overflow:hidden; border:1px solid var(--line); }
  .xp-bar-fill{ height:100%; background:linear-gradient(90deg,var(--gold),var(--accent)); width:0%; transition:width .4s ease; }
  .xp-label{ font-size:13px; color:var(--ink-soft); margin-top:4px; }

  .modes{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .mode-btn{
    border:1px solid var(--line); background:var(--card); color:var(--ink-soft);
    padding:9px 16px; border-radius:99px; font-size:15px; cursor:pointer;
    transition:all .15s ease;
  }
  .mode-btn.active{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .mode-btn:hover{ transform:translateY(-1px); }

  .card{
    background:var(--card);
    border:1px solid var(--line); border-radius:20px;
    padding:20px 24px 28px; box-shadow: var(--shadow); min-height:260px;
    display:flex; flex-direction:column; align-items:stretch; justify-content:flex-start;
    text-align:center; position:relative; overflow:hidden;
  }
  .mute-btn{
    width:26px; height:26px; border-radius:50%; padding:0; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg-2); border:1px solid var(--line); color:var(--ink-soft);
    font-size:13px; cursor:pointer; -webkit-tap-highlight-color: transparent;
  }
  .mute-btn:hover{ border-color:var(--accent-soft); }
  .card-top{ display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%; margin-bottom:16px; }
  .card-top-left{ display:flex; align-items:center; gap:8px; }
  .card-body{ flex:1; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .card .badge{
    font-size:13px; color:var(--ink-soft);
    background:var(--bg-2); padding:4px 10px; border-radius:99px; border:1px solid var(--line);
  }
  .card .badge-group{
    font-size:13px; color:var(--accent-dark);
    background:var(--accent-soft); padding:4px 10px; border-radius:99px; border:1px solid var(--accent-soft);
  }
  .badge-cluster{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
  .card .badge-new{
    font-size:13px; color:#8a6d00; font-weight:600;
    background:#fff3c4; padding:4px 10px; border-radius:99px; border:1px solid #f0dfa0;
  }
  .prompt-label{ font-size:14px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:10px;}
  .prompt-word{ font-size:34px; font-weight:700; margin-bottom:4px; word-break:break-word; padding-top:8px; }
  .prompt-sub{ font-size:16px; color:var(--ink-soft); margin-bottom:22px; }
  .prompt-sentence{ font-size:23px; font-weight:600; line-height:1.4; margin-bottom:22px; padding-top:8px; }
  ruby rt{ font-size:0.68em; color:var(--ink-soft); font-weight:400; user-select:none; }
  .app.hide-furigana rt{ display:none; }

  .choices{ display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; }
  .choice-btn{
    border:1.5px solid var(--line); background:#fffefb; border-radius:14px;
    padding:10px 12px; font-size:22px; cursor:pointer; color:var(--ink);
    transition:all .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .choice-btn:hover{ border-color:var(--accent-soft); background:#fff7f2; }
  .choice-btn.correct{ background:var(--good-bg); border-color:var(--good); color:var(--good); font-weight:700; }
  .choice-btn.wrong{ background:var(--bad-bg); border-color:var(--bad); color:var(--bad); font-weight:700; }
  .choice-btn.dim{ opacity:0.45; }
  .choice-btn:disabled{ cursor:default; }

  .type-form{ width:100%; }
  .type-input{
    width:100%; font-size:24px; padding:10px; border-radius:12px;
    border:1.5px solid var(--line); text-align:center; outline:none;
    font-family:inherit;
  }
  .type-input:focus{ border-color:var(--accent); }
  .type-actions{ display:flex; gap:10px; margin-top:14px; justify-content:center; }
  .feedback-line{ margin-top:14px; font-size:16px; min-height:20px; }
  .feedback-line.good{ color:var(--good); font-weight:600; }
  .feedback-line.bad{ color:var(--bad); font-weight:600; }

  .primary-btn, .ghost-btn{
    border-radius:12px; padding:13px 22px; font-size:16px; cursor:pointer; font-weight:600;
    border:1.5px solid transparent;
  }
  .primary-btn{ background:var(--accent); color:#fff; }
  .primary-btn:hover{ background:var(--accent-dark); }
  .ghost-btn{ background:transparent; border-color:var(--line); color:var(--ink-soft); }
  .ghost-btn:hover{ border-color:var(--accent-soft); color:var(--ink); }

  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-top:16px; flex-wrap:wrap; gap:10px; }
  .toolbar-actions{ display:flex; align-items:center; gap:14px; }
  .sync-note{ font-size:14px; color:var(--ink-soft); }
  .sync-note.err{ color:var(--bad); }
  .link-btn{ background:none; border:none; color:var(--accent); font-size:14px; cursor:pointer; text-decoration:underline; padding:0; }

  .state-box{
    text-align:center; padding:40px 20px; color:var(--ink-soft);
    flex:1; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .spinner{
    width:34px;height:34px;border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--accent);
    animation:spin 0.8s linear infinite; margin:0 auto 16px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .summary-emoji{ font-size:44px; margin-bottom:6px; }
  .summary-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; margin:18px 0; }
  .summary-cell{ background:var(--bg-2); border-radius:12px; padding:12px; }
  .summary-cell .num{ font-size:20px; font-weight:700; }
  .summary-cell .lbl{ font-size:11px; color:var(--ink-soft); text-transform:uppercase; }

  footer{ text-align:center; font-size:13px; color:var(--ink-soft); margin-top:20px; }
</style>
</head>
<body>
<div class="app" id="app">

  <header class="top">
    <div class="brand">
      <div class="mark">動</div>
      <div>
        <h1>Verb Dojo</h1>
        <p>daily verb-conjugation practice</p>
      </div>
    </div>
    <div class="modes" id="modeSelector">
      <button class="mode-btn active" data-mode="mixed">Mixed</button>
      <button class="mode-btn" data-mode="mc">Multiple Choice</button>
      <button class="mode-btn" data-mode="type">Typing</button>
      <button class="mode-btn" data-mode="pattern">Patterns</button>
      <button class="mode-btn" data-mode="sentence">Sentences</button>
    </div>
  </header>

  <div class="stats-bar">
    <div class="stats-row">
      <div class="stat"><span class="num" id="statLevel">1</span><span class="lbl">Level</span></div>
      <div class="stat"><span class="num streak" id="statStreak">0 🔥</span><span class="lbl">Streak</span></div>
      <div class="stat"><span class="num" id="statBest">0</span><span class="lbl">Best</span></div>
      <div class="stat"><span class="num" id="statAcc">—</span><span class="lbl">Accuracy</span></div>
      <div class="xp-wrap">
        <div class="xp-bar-bg"><div class="xp-bar-fill" id="xpBar"></div></div>
        <div class="xp-label" id="xpLabel">0 / 50 XP</div>
      </div>
    </div>
  </div>

  <div class="card" id="card">
    <div class="state-box">
      <div class="spinner"></div>
      <div>Loading your vocab from the sheet…</div>
    </div>
  </div>

  <div class="toolbar">
    <span class="sync-note" id="syncNote">Loading vocab…</span>
    <div class="toolbar-actions">
      <button class="link-btn" id="furiganaToggle">ふりがな: On</button>
      <button class="link-btn" id="refreshBtn">↻ Reload vocab</button>
    </div>
  </div>

  <footer>Built for Sarah's Japanese vocab practice · words load from vocab-data.js in this folder</footer>
</div>

<script src="vocab-data.js"></script>
<script src="sentence-data.js"></script>
<script>
(function(){
  // ---------- Fallback seed data (used only if vocab-data.js is missing/empty) ----------
  var FALLBACK_WORDS = [
    {dict:"食べる", english:"to eat", masu:"食べます", te:"食べて"},
    {dict:"飲む", english:"to drink", masu:"飲みます", te:"飲んで"},
    {dict:"見る", english:"to see / watch", masu:"見ます", te:"見て"},
    {dict:"行く", english:"to go", masu:"行きます", te:"行って"},
    {dict:"話す", english:"to speak", masu:"話します", te:"話して"}
  ];

  // ---------- New-word prioritization ----------
  // Words the learner hasn't "graduated" past yet get a much higher pick weight so they
  // surface more often, plus a small "New" badge. A word graduates (goes back to normal
  // weighting) once it's been answered correctly NEW_WORD_MASTERY times. Graduated words
  // are remembered in localStorage so this persists across sessions/days.
  var STORAGE_KEY = "verbDojoKnownWords_v1";
  var NEW_WORD_WEIGHT = 9;
  var NEW_WORD_MASTERY = 2;

  function loadKnownWords(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch(e){ return []; }
  }
  function saveKnownWords(arr){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); } catch(e){ /* ignore (private mode, etc.) */ }
  }

  // ---------- State ----------
  var MODES_FOR_STATS = ["mixed","mc","type","pattern","sentence"];

  function loadBestByMode(){
    var result = {};
    MODES_FOR_STATS.forEach(function(m){ result[m] = 0; });
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem("verbDojoBestByMode")); } catch(e){}
    if (saved && typeof saved === "object"){
      MODES_FOR_STATS.forEach(function(m){ if (typeof saved[m] === "number") result[m] = saved[m]; });
    } else {
      var legacy = parseInt(localStorage.getItem("verbDojoBest"), 10);
      if (legacy) result.mixed = legacy; // one-time migration from the old shared best
    }
    return result;
  }

  var state = {
    words: [],
    weights: {},           // word.dict -> weight (higher = shown more often)
    mode: "mixed",
    current: null,          // current question object
    xp: 0,
    level: 1,
    streaksByMode: {mixed:0, mc:0, type:0, pattern:0, sentence:0},
    bestByMode: loadBestByMode(),
    correct: 0,
    answered: 0,
    usingFallback: false,
    showFurigana: true,
    muted: localStorage.getItem("verbDojoMuted") === "1",
    dictToHiragana: {},
    knownWords: {},         // dict -> true, words that have graduated past "new" status
    newCorrectCounts: {},   // dict -> correct answers so far while still marked new
    lastSentenceIndex: -1
  };

  var sounds = {
    correct: new Audio("right-answer.wav"),
    wrong: new Audio("wrong-answer.wav")
  };
  sounds.correct.volume = 0.5;
  sounds.wrong.volume = 0.7;

  var els = {
    app: document.getElementById("app"),
    card: document.getElementById("card"),
    syncNote: document.getElementById("syncNote"),
    refreshBtn: document.getElementById("refreshBtn"),
    furiganaToggle: document.getElementById("furiganaToggle"),
    statLevel: document.getElementById("statLevel"),
    statStreak: document.getElementById("statStreak"),
    statBest: document.getElementById("statBest"),
    statAcc: document.getElementById("statAcc"),
    xpBar: document.getElementById("xpBar"),
    xpLabel: document.getElementById("xpLabel"),
    modeSelector: document.getElementById("modeSelector")
  };

  // Sets up weights/hiragana lookup/new-word status for a word list. Returns how many
  // words were detected as "new" (not yet graduated per localStorage).
  function initWordsState(words){
    var knownArr = loadKnownWords();
    var knownSet = {};
    knownArr.forEach(function(d){ knownSet[d] = true; });
    state.knownWords = knownSet;

    var newCount = 0;
    words.forEach(function(w){
      var isNew = !knownSet[w.dict];
      if (isNew) newCount++;
      if (!(w.dict in state.weights)) state.weights[w.dict] = isNew ? NEW_WORD_WEIGHT : 3;
      state.dictToHiragana[w.dict] = w.hiragana || "";
    });
    return newCount;
  }

  function isNewWord(word){ return !state.knownWords[word.dict]; }

  function graduateWord(word){
    if (state.knownWords[word.dict]) return;
    state.knownWords[word.dict] = true;
    state.weights[word.dict] = 3; // back to normal priority now that it's learned
    saveKnownWords(Object.keys(state.knownWords));
  }

  // ---------- Loading vocab from the local vocab-data.js file ----------
  function loadVocab(){
    els.syncNote.textContent = "Loading vocab…";
    els.syncNote.classList.remove("err");
    state.usingFallback = false;

    var words = (window.VOCAB_WORDS || []).filter(function(w){ return w && w.dict && w.english; });
    if (!words.length){
      useFallback("vocab-data.js not found or empty.");
      return;
    }
    state.words = words;
    var newCount = initWordsState(words);
    els.syncNote.textContent = "Loaded " + words.length + " word" + (words.length===1?"":"s") + " from vocab-data.js" +
      (newCount ? " · " + newCount + " new ✨ (prioritized)" : "");
    startRound();
  }

  function useFallback(reason){
    state.usingFallback = true;
    state.words = FALLBACK_WORDS.slice();
    initWordsState(state.words);
    els.syncNote.textContent = "⚠ " + reason + " Practicing with 5 sample verbs for now.";
    els.syncNote.classList.add("err");
    startRound();
  }

  // ---------- Weighted word picker (wrong / new words show up more often) ----------
  function pickWord(excludeDict){
    var pool = state.words.filter(function(w){ return w.dict !== excludeDict; });
    if (!pool.length) pool = state.words;
    var total = 0;
    pool.forEach(function(w){ total += (state.weights[w.dict] || 1); });
    var r = Math.random() * total;
    for (var i=0;i<pool.length;i++){
      r -= (state.weights[pool[i].dict] || 1);
      if (r <= 0) return pool[i];
    }
    return pool[pool.length-1];
  }

  function bump(word, wasCorrect){
    var w = state.weights[word.dict] || 3;
    state.weights[word.dict] = wasCorrect ? Math.max(1, w-1) : Math.min(12, w+3);
  }

  // ---------- Question construction ----------
  var PROMPT_TYPES_MC = ["dict2eng","eng2dict","dict2masu","dict2te","dict2nai"];

  // Grammar patterns for "choose the right form" practice — same 14 patterns as
  // sentence-data.js, minus the て-connector (no fixed suffix, doesn't fit this format).
  var GRAMMAR_PATTERNS = [
    {name:"のが好きです", form:"dict", suffix:"のが好きです", meaning:"I like doing ~"},
    {name:"つもりです",   form:"dict", suffix:"つもりです",   meaning:"I plan to / intend to ~"},
    {name:"前に",         form:"dict", suffix:"前に",         meaning:"before doing ~"},
    {name:"ましょうか",   form:"stem", suffix:"ましょうか",   meaning:"Shall we ~?"},
    {name:"ます form",    form:"masu", suffix:"",             meaning:"polite present/future statement"},
    {name:"たいです",     form:"stem", suffix:"たいです",     meaning:"I want to ~"},
    {name:"すぎました",   form:"stem", suffix:"すぎました",   meaning:"did too much of ~"},
    {name:"てください",   form:"te",   suffix:"ください",     meaning:"please do ~"},
    {name:"ていただけませんか", form:"te", suffix:"いただけませんか", meaning:"could you please ~"},
    {name:"てもいいですか", form:"te", suffix:"もいいですか", meaning:"may I ~?"},
    {name:"ています",     form:"te",   suffix:"います",       meaning:"ongoing / habitual action"},
    {name:"ていました",   form:"te",   suffix:"いました",     meaning:"past progressive"},
    {name:"まだ〜ていません", form:"te", suffix:"いません", prefix:"まだ", meaning:"haven't done ~ yet"},
    {name:"ことがあります", form:"ta", suffix:"ことがあります", meaning:"I have done ~ before"},
    {name:"ほうがいいです", form:"ta", suffix:"ほうがいいです", meaning:"it's better to have done ~ / you should ~"},
    {name:"ないでください", form:"nai", suffix:"でください", meaning:"please don't do ~"}
  ];

  function getFormValue(word, formType){
    if (formType === "dict") return word.dict;
    if (formType === "masu") return word.masu || null;
    if (formType === "te") return word.te || null;
    if (formType === "nai") return word.nai || null;
    if (formType === "stem") return word.masu ? word.masu.slice(0, -2) : null; // drop trailing ます
    if (formType === "ta"){ // た form is a regular て/で -> た/だ swap on the te form
      if (!word.te) return null;
      if (word.te.slice(-1) === "で") return word.te.slice(0, -1) + "だ";
      if (word.te.slice(-1) === "て") return word.te.slice(0, -1) + "た";
      return null;
    }
    return null;
  }

  function startRound(){
    if (state.words.length < 1){ useFallback("No vocab available yet."); return; }
    var mode = state.mode;
    if (mode === "sentence"){ renderSentence(); return; }
    if (mode === "pattern"){ renderPattern(); return; }

    var word = pickWord(state.current && state.current.word ? state.current.word.dict : null);
    if (mode === "mixed") mode = Math.random() < 0.65 ? "mc" : "type";
    if (mode === "mc" && state.words.length < 4) mode = "type"; // need enough words for distractors

    if (mode === "mc") renderMC(word);
    else renderType(word);
  }

  function renderMC(word){
    var type = PROMPT_TYPES_MC[Math.floor(Math.random()*PROMPT_TYPES_MC.length)];
    var promptText, promptLabel, correctAnswer, pool;
    if (type === "dict2eng"){
      promptLabel = "What does this verb mean?"; promptText = word.dict;
      correctAnswer = word.english; pool = state.words.map(function(w){return w.english;});
    } else if (type === "eng2dict"){
      promptLabel = "Which verb means this?"; promptText = word.english;
      correctAnswer = word.dict; pool = state.words.map(function(w){return w.dict;});
    } else if (type === "dict2masu"){
      promptLabel = "Masu form of " + word.dict + " (" + word.english + ")?"; promptText = word.dict;
      correctAnswer = word.masu; pool = state.words.map(function(w){return w.masu;}).filter(Boolean);
    } else if (type === "dict2te"){
      promptLabel = "Te form of " + word.dict + " (" + word.english + ")?"; promptText = word.dict;
      correctAnswer = word.te; pool = state.words.map(function(w){return w.te;}).filter(Boolean);
    } else {
      promptLabel = "Nai form of " + word.dict + " (" + word.english + ")?"; promptText = word.dict;
      correctAnswer = word.nai; pool = state.words.map(function(w){return w.nai;}).filter(Boolean);
    }
    if (!correctAnswer || pool.length < 4){ renderType(word); return; }

    var distractors = shuffle(pool.filter(function(a){return a !== correctAnswer;})).slice(0,3);
    while (distractors.length < 3) distractors.push(correctAnswer); // safety net, shouldn't normally trigger
    var options = shuffle([correctAnswer].concat(distractors));

    state.current = {mode:"mc", word:word, type:type, correctAnswer:correctAnswer};

    var promptIsDict = (type !== "eng2dict");

    var html = '<div class="card-top"><div class="card-top-left">';
    html += isNewWord(word) ? '<div class="badge-new">✨ New</div>' : '<div></div>';
    html += muteBtnHtml();
    html += '</div><div class="badge-cluster">';
    html += word.group ? ('<div class="badge-group">' + escapeHtml(groupLabel(word.group)) + '</div>') : '';
    html += '</div></div><div class="card-body">';
    html += '<div class="prompt-label">' + escapeHtml(promptLabel) + '</div>';
    html += '<div class="prompt-word">' + (promptIsDict ? furiganaHtml(promptText, word.hiragana) : escapeHtml(promptText)) + '</div>';
    html += '<div class="choices">';
    options.forEach(function(opt){
      var label = (type === "eng2dict") ? furiganaHtml(opt, state.dictToHiragana[opt]) : escapeHtml(opt);
      html += '<button class="choice-btn" data-val="' + escapeAttr(opt) + '">' + label + '</button>';
    });
    html += '</div></div>';
    els.card.innerHTML = html;
    wireMuteBtn();

    Array.prototype.forEach.call(els.card.querySelectorAll(".choice-btn"), function(btn){
      btn.addEventListener("click", function(){ handleMCAnswer(btn, options); });
    });
  }

  function handleMCAnswer(btn, allOptionEls){
    var buttons = els.card.querySelectorAll(".choice-btn");
    Array.prototype.forEach.call(buttons, function(b){ b.disabled = true; });
    var chosen = btn.getAttribute("data-val");
    var correct = state.current.correctAnswer;
    var wasCorrect = chosen === correct;
    Array.prototype.forEach.call(buttons, function(b){
      var v = b.getAttribute("data-val");
      if (v === correct) b.classList.add("correct");
      else if (b === btn) b.classList.add("wrong");
      else b.classList.add("dim");
    });
    registerAnswer(wasCorrect);
    setTimeout(nextButtonRow, wasCorrect ? 650 : 2800);
  }

  function renderType(word){
    var candidates = shuffle([
      {label:"Masu form", target:word.masu, kana:word.masuHiragana},
      {label:"Te form", target:word.te, kana:word.teHiragana},
      {label:"Nai form", target:word.nai, kana:word.naiHiragana}
    ].filter(function(c){ return c.target; }));
    if (!candidates.length){ renderMC(word); return; } // no forms present at all, bail to MC
    var choice = candidates[0];
    var target = choice.target, label = choice.label, targetKana = choice.kana;

    state.current = {mode:"type", word:word, correctAnswer:target, correctAnswerKana:targetKana};

    var html = '<div class="card-top"><div class="card-top-left">';
    html += isNewWord(word) ? '<div class="badge-new">✨ New</div>' : '<div></div>';
    html += muteBtnHtml();
    html += '</div><div class="badge-cluster">';
    html += word.group ? ('<div class="badge-group">' + escapeHtml(groupLabel(word.group)) + '</div>') : '';
    html += '</div></div><div class="card-body">';
    html += '<div class="prompt-label">Type the ' + label + '</div>';
    html += '<div class="prompt-word">' + furiganaHtml(word.dict, word.hiragana) + '</div>';
    html += '<div class="prompt-sub">' + escapeHtml(word.english) + '</div>';
    html += '<form class="type-form" id="typeForm">';
    html += '<input class="type-input" id="typeInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="answer in Japanese">';
    html += '<div class="type-actions"><button type="submit" class="primary-btn">Check</button></div>';
    html += '<div class="feedback-line" id="typeFeedback"></div>';
    html += '</form></div>';
    els.card.innerHTML = html;
    wireMuteBtn();

    var input = document.getElementById("typeInput");
    input.focus();
    document.getElementById("typeForm").addEventListener("submit", function(e){
      e.preventDefault();
      submitType(input.value);
    });
  }

  function submitType(value){
    var input = document.getElementById("typeInput");
    var feedback = document.getElementById("typeFeedback");
    if (input.disabled) return;
    input.disabled = true;
    var correct = state.current.correctAnswer;
    var correctKana = state.current.correctAnswerKana;
    var typed = normalizeJp(value);
    var wasCorrect = typed === normalizeJp(correct) || (correctKana && typed === normalizeJp(correctKana));
    if (wasCorrect){
      feedback.textContent = "✓ Correct!";
      feedback.className = "feedback-line good";
    } else {
      feedback.textContent = "✗ Correct answer: " + correct;
      feedback.className = "feedback-line bad";
    }
    registerAnswer(wasCorrect);
    setTimeout(nextButtonRow, wasCorrect ? 700 : 8800);
  }

  // ---------- Sentence pattern practice ----------
  function normalizeJp(s){
    return String(s||"")
      .replace(/[　\s]+/g, "")            // strip all spaces (full and half width)
      .replace(/[。、！？，．,.!?]+/g, ""); // strip punctuation anywhere, not just trailing
  }

  function pickSentence(){
    var bank = window.SENTENCE_PRACTICE || [];
    if (!bank.length) return null;
    if (bank.length === 1) return {entry: bank[0], index: 0};
    var idx;
    do { idx = Math.floor(Math.random() * bank.length); } while (idx === state.lastSentenceIndex);
    state.lastSentenceIndex = idx;
    return {entry: bank[idx], index: idx};
  }

  function renderSentence(){
    var picked = pickSentence();
    if (!picked){ renderType(pickWord(null)); return; } // no sentence bank available, fall back

    state.current = {mode:"sentence", word:null, correctAnswer: picked.entry.jp, correctAnswerKana: picked.entry.kana};

    var html = '<div class="card-top"><div class="card-top-left"><div class="badge">Sentence Practice</div>' + muteBtnHtml() + '</div><div></div></div>';
    html += '<div class="card-body">';
    html += '<div class="prompt-label">Translate to Japanese</div>';
    html += '<div class="prompt-sentence">' + escapeHtml(picked.entry.en) + '</div>';
    html += '<form class="type-form" id="typeForm">';
    html += '<input class="type-input" id="typeInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="answer in Japanese">';
    html += '<div class="type-actions"><button type="submit" class="primary-btn">Check</button>';
    if (MIC_SUPPORTED) html += '<button type="button" class="ghost-btn" id="micBtn">🎤 Speak</button>';
    html += '</div>';
    html += '<div class="feedback-line" id="typeFeedback"></div>';
    html += '</form></div>';
    els.card.innerHTML = html;
    wireMuteBtn();

    var input = document.getElementById("typeInput");
    input.focus();
    document.getElementById("typeForm").addEventListener("submit", function(e){
      e.preventDefault();
      submitSentence(input.value);
    });

    if (MIC_SUPPORTED){
      var micBtn = document.getElementById("micBtn");
      micBtn.addEventListener("click", function(){ startMicInput(input, micBtn); });
    }
  }

  function submitSentence(value){
    var input = document.getElementById("typeInput");
    var feedback = document.getElementById("typeFeedback");
    if (input.disabled) return;
    input.disabled = true;
    var correct = state.current.correctAnswer;
    var correctKana = state.current.correctAnswerKana;
    var typed = normalizeJp(value);
    var wasCorrect = typed === normalizeJp(correct) || (correctKana && typed === normalizeJp(correctKana));
    if (wasCorrect){
      feedback.textContent = "✓ Correct!";
      feedback.className = "feedback-line good";
    } else {
      feedback.textContent = "✗ Correct answer: " + correct;
      feedback.className = "feedback-line bad";
    }
    registerAnswer(wasCorrect);
    setTimeout(nextButtonRow, wasCorrect ? 700 : 9000);
  }

  // ---------- "Choose the right verb form" pattern practice ----------
  function renderPattern(){
    var pattern = GRAMMAR_PATTERNS[Math.floor(Math.random()*GRAMMAR_PATTERNS.length)];
    var eligible = state.words.filter(function(w){ return w.masu && w.te && getFormValue(w, pattern.form); });
    if (!eligible.length){ renderType(pickWord(null)); return; } // shouldn't happen, safe fallback

    var word = eligible[Math.floor(Math.random()*eligible.length)];
    var stem = getFormValue(word, "stem");
    var correctAnswer = getFormValue(word, pattern.form);

    var candidates = [word.dict, word.masu, word.te, stem, word.nai].filter(function(v){ return v && v !== correctAnswer; });
    candidates = shuffle(candidates).slice(0,3);
    while (candidates.length < 3) candidates.push(correctAnswer); // safety net, shouldn't normally trigger
    var options = shuffle([correctAnswer].concat(candidates));

    state.current = {mode:"pattern", word:word, correctAnswer:correctAnswer};

    var blankLabel = (pattern.prefix || "") + "＿＿＿" + pattern.suffix;

    var html = '<div class="card-top"><div class="card-top-left"><div class="badge">Pattern Practice</div>' + muteBtnHtml() + '</div><div></div></div>';
    html += '<div class="card-body">';
    html += '<div class="prompt-label">Which form completes: ' + escapeHtml(blankLabel) + '</div>';
    html += '<div class="prompt-word">' + furiganaHtml(word.dict, word.hiragana) + '</div>';
    html += '<div class="prompt-sub">' + escapeHtml(word.english) + ' &middot; ' + escapeHtml(pattern.name) + ' — ' + escapeHtml(pattern.meaning) + '</div>';
    html += '<div class="choices">';
    options.forEach(function(opt){
      html += '<button class="choice-btn" data-val="' + escapeAttr(opt) + '">' + escapeHtml(opt) + '</button>';
    });
    html += '</div></div>';
    els.card.innerHTML = html;
    wireMuteBtn();

    Array.prototype.forEach.call(els.card.querySelectorAll(".choice-btn"), function(btn){
      btn.addEventListener("click", function(){ handleMCAnswer(btn, options); });
    });
  }

  function nextButtonRow(){ startRound(); }

  // ---------- Scoring ----------
  function registerAnswer(wasCorrect){
    if (!state.muted){
      if (!wasCorrect){
        sounds.wrong.currentTime = 0;
        sounds.wrong.play().catch(function(){});
      } else {
        sounds.correct.currentTime = 0;
        sounds.correct.play().catch(function(){});
      }
    }
    var word = state.current.word;
    if (word){
      bump(word, wasCorrect);

      if (isNewWord(word) && wasCorrect){
        state.newCorrectCounts[word.dict] = (state.newCorrectCounts[word.dict] || 0) + 1;
        if (state.newCorrectCounts[word.dict] >= NEW_WORD_MASTERY) graduateWord(word);
      }
    }

    state.answered++;
    var m = state.mode;
    if (wasCorrect){
      state.correct++;
      state.streaksByMode[m] = (state.streaksByMode[m] || 0) + 1;
      state.bestByMode[m] = Math.max(state.bestByMode[m] || 0, state.streaksByMode[m]);
      localStorage.setItem("verbDojoBestByMode", JSON.stringify(state.bestByMode));
      var bonus = Math.floor(state.streaksByMode[m]/5) * 5;
      state.xp += 10 + bonus;
    } else {
      state.streaksByMode[m] = 0;
    }
    var newLevel = Math.floor(state.xp/50) + 1;
    state.level = newLevel;
    renderStats();
  }

  function renderStats(){
    els.statLevel.textContent = state.level;
    els.statStreak.textContent = (state.streaksByMode[state.mode] || 0) + " 🔥";
    els.statBest.textContent = state.bestByMode[state.mode] || 0;
    els.statAcc.textContent = state.answered ? Math.round(100*state.correct/state.answered) + "%" : "—";
    var xpIntoLevel = state.xp % 50;
    els.xpBar.style.width = (xpIntoLevel/50*100) + "%";
    els.xpLabel.textContent = xpIntoLevel + " / 50 XP";
  }

  // ---------- Mic input (Sentence mode) — desktop Chrome on Mac only ----------
  // Speech-to-text via the Web Speech API is unreliable/unsupported on Safari and
  // WebKit-based browsers (which includes every browser on iOS), so this is scoped
  // narrowly to avoid a broken/inconsistent mic button anywhere else.
  function isMacChrome(){
    var ua = navigator.userAgent;
    return /Macintosh/.test(ua) && /Chrome\//.test(ua) && !/Edg\//.test(ua) && !/OPR\//.test(ua);
  }
  var SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  var MIC_SUPPORTED = isMacChrome() && !!SpeechRecognitionCtor;

  function startMicInput(input, micBtn){
    var recognition = new SpeechRecognitionCtor();
    recognition.lang = "ja-JP";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    micBtn.disabled = true;
    micBtn.textContent = "🎤 Listening…";

    recognition.onresult = function(e){
      input.value = e.results[0][0].transcript;
      input.focus();
    };
    recognition.onerror = function(e){
      console.warn("Speech recognition error:", e.error);
      micBtn.textContent = "🎤 Speak (" + e.error + ")";
      micBtn.disabled = false;
    };
    recognition.onend = function(){
      micBtn.textContent = "🎤 Speak";
      micBtn.disabled = false;
    };
    recognition.start();
  }

  // ---------- Helpers ----------
  function shuffle(arr){
    var a = arr.slice();
    for (var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function escapeAttr(s){ return escapeHtml(s).replace(/"/g,"&quot;"); }
  var SPEAKER_ICON_SVG =
    '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>' +
    '<path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>' +
    '<path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>' +
    '</svg>';
  var SPEAKER_MUTED_ICON_SVG =
    '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>' +
    '<line x1="2" y1="21" x2="21" y2="2"></line>' +
    '</svg>';

  function muteBtnHtml(){
    var icon = state.muted ? SPEAKER_MUTED_ICON_SVG : SPEAKER_ICON_SVG;
    var label = state.muted ? "Unmute sound effects" : "Mute sound effects";
    return '<button type="button" class="mute-btn" id="muteBtn" aria-label="' + label + '">' + icon + '</button>';
  }
  function wireMuteBtn(){
    var btn = document.getElementById("muteBtn");
    if (!btn) return;
    btn.addEventListener("click", function(){
      state.muted = !state.muted;
      localStorage.setItem("verbDojoMuted", state.muted ? "1" : "0");
      btn.innerHTML = state.muted ? SPEAKER_MUTED_ICON_SVG : SPEAKER_ICON_SVG;
      btn.setAttribute("aria-label", state.muted ? "Unmute sound effects" : "Mute sound effects");
    });
  }
  function furiganaHtml(text, reading){
    var safeText = escapeHtml(text);
    if (!reading || reading === text) return safeText;
    return '<ruby>' + safeText + '<rt>' + escapeHtml(reading) + '</rt></ruby>';
  }
  function groupLabel(g){
    if (g === 1) return "Group 1 · う-verb";
    if (g === 2) return "Group 2 · る-verb";
    if (g === 3) return "Group 3 · irregular";
    return "";
  }

  // ---------- Mode selector ----------
  els.modeSelector.addEventListener("click", function(e){
    var btn = e.target.closest(".mode-btn");
    if (!btn) return;
    Array.prototype.forEach.call(els.modeSelector.querySelectorAll(".mode-btn"), function(b){ b.classList.remove("active"); });
    btn.classList.add("active");
    state.mode = btn.getAttribute("data-mode");
    renderStats();
    startRound();
  });

  els.furiganaToggle.addEventListener("click", function(){
    state.showFurigana = !state.showFurigana;
    els.app.classList.toggle("hide-furigana", !state.showFurigana);
    els.furiganaToggle.textContent = "ふりがな: " + (state.showFurigana ? "On" : "Off");
  });

  // Mute button markup is rebuilt into every question card (see muteBtnHtml/wireMuteBtn
  // below), since it sits inline next to the top-left badge rather than as a fixed element.

  els.refreshBtn.addEventListener("click", function(){
    els.card.innerHTML = '<div class="state-box"><div class="spinner"></div><div>Refreshing from your sheet…</div></div>';
    loadVocab();
  });

  renderStats();
  loadVocab();
})();
</script>
